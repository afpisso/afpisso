<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScrollMaskedTitleReveal — Exact</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0a0a0a; }
    .scroll-section { height: 500vh; }

    /* Sticky stage */
    .sticky-stage {
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* Canvas covers full stage — draws everything */
    #mainCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* CSS title: solid cream — always visible, sits UNDER canvas */
    .hero-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    .hero-title__text {
      font-family: 'Barlow Condensed', Impact, 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 17vw;
      color: #f0ede8;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    /* Hidden image source for canvas */
    #sourceImg {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #hud {
      position: fixed; bottom: 1rem; left: 50%;
      transform: translateX(-50%);
      font-family: monospace; font-size: 0.6rem;
      color: rgba(255,255,255,0.3); z-index: 999;
      pointer-events: none; letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<div class="scroll-section" id="scrollSection">
  <div class="sticky-stage" id="stickyStage">

    <!-- Image source (hidden — canvas reads from it) -->
    <img id="sourceImg" crossorigin="anonymous"
      src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1600&q=80"
      alt="" />

    <!-- CSS title underneath canvas -->
    <div class="hero-title">
      <span class="hero-title__text" id="cssTitle">SHOGUN PIZZA</span>
    </div>

    <!-- Canvas: draws pixelated mosaic IN the letter shapes (on top of CSS title) -->
    <canvas id="mainCanvas"></canvas>

  </div>
</div>
<div id="hud">p: 0.000</div>

<script>
// ─── Exact parameters from yutaabe.com WebGL shader ──────────────
const CELL    = 10      // pixelSize = 10.0 in GLSL
const GAP     = 0.07    // smoothstep gap = 7% of cell = 0.7px each side
const DRAW    = Math.round(CELL * (1 - GAP * 2))  // ~8px visible per tile

// Sweep band height as fraction of viewport
const BAND_FRAC = 0.52   // band covers ~52% of viewport height

// Image horizontal travel (parallax)
const IMG_TRAVEL = 0.12  // 12% of image width

// ─── DOM ─────────────────────────────────────────────────────────
const section   = document.getElementById('scrollSection')
const canvas    = document.getElementById('mainCanvas')
const ctx       = canvas.getContext('2d')
const cssTitle  = document.getElementById('cssTitle')
const sourceImg = document.getElementById('sourceImg')
const hud       = document.getElementById('hud')

// ─── Canvas resize ───────────────────────────────────────────────
function resize() {
  canvas.width  = window.innerWidth
  canvas.height = window.innerHeight
}
resize()
window.addEventListener('resize', resize)

// ─── Offscreen canvas (reused each frame) ────────────────────────
const offscreen = document.createElement('canvas')
const octx      = offscreen.getContext('2d')

function syncOffscreen() {
  offscreen.width  = canvas.width
  offscreen.height = canvas.height
}
syncOffscreen()
window.addEventListener('resize', syncOffscreen)

// ─── Helpers ─────────────────────────────────────────────────────
const easeInOut = t => t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t

function remap(v, i0, i1, o0, o1) {
  const t = Math.max(0, Math.min(1, (v - i0) / (i1 - i0)))
  return o0 + (o1 - o0) * easeInOut(t)
}

// ─── Font matching ───────────────────────────────────────────────
function setFont(c) {
  const fontSize = canvas.width * 0.17
  c.font = `900 ${fontSize}px 'Barlow Condensed', Impact, 'Arial Black', sans-serif`
  c.textAlign    = 'center'
  c.textBaseline = 'middle'
  cssTitle.style.fontSize = fontSize + 'px'
}

// ─── Draw pixelated mosaic tiles clipped to letter shapes ────────
// This is the core effect matching the yutaabe.com WebGL shader:
// - Each tile is CELL×CELL px, drawn at DRAW×DRAW (with ~0.7px gap each side)
// - Tile samples image at the CENTER of the cell (as in WebGL shader)
// - Tiles are drawn only in the vertical band [bandTop, bandBot]
// - destination-in clips tiles to letter shapes
function drawMosaicInLetters(p) {
  const W = canvas.width
  const H = canvas.height
  const img = sourceImg

  if (!img.complete || img.naturalWidth === 0) return

  const imgW = img.naturalWidth
  const imgH = img.naturalHeight

  // Image cover-scale (same as object-fit:cover)
  const scale = Math.max(W / imgW, H / imgH)
  // Center image, apply horizontal parallax based on scroll
  const scaledW  = imgW * scale
  const scaledH  = imgH * scale
  const baseSrcX = (scaledW - W) / 2 / scale   // src px to center horizontally
  const baseSrcY = (scaledH - H) / 2 / scale   // src px to center vertically
  const parallaxX = remap(p, 0, 1, 0, IMG_TRAVEL * imgW)  // image moves left

  // Band: sweeps from bottom of viewport to top as p goes 0→1
  const bandH    = H * BAND_FRAC
  const centerY  = remap(p, 0, 1, H + bandH / 2, -bandH / 2)
  const bandTop  = Math.round(centerY - bandH / 2)
  const bandBot  = Math.round(centerY + bandH / 2)

  // ── Step 1: Draw all mosaic tiles in the band (source-over) ────
  octx.clearRect(0, 0, W, H)

  const gap = Math.round(CELL * GAP)   // ≈1px each side

  for (let ty = bandTop; ty < bandBot; ty += CELL) {
    for (let tx = 0; tx < W; tx += CELL) {
      // Sample image at CELL CENTER (matching WebGL: pixelSize * 0.5)
      const cellCenterCanvasX = tx + CELL / 2
      const cellCenterCanvasY = ty + CELL / 2

      const srcX = cellCenterCanvasX / scale + baseSrcX - parallaxX
      const srcY = cellCenterCanvasY / scale + baseSrcY

      if (srcX < 0 || srcY < 0 || srcX >= imgW || srcY >= imgH) continue

      // Draw tile: slightly inset by gap amount (matching GLSL gap formula)
      octx.drawImage(
        img,
        srcX - (DRAW / 2) / scale, srcY - (DRAW / 2) / scale,   // src: centered on cell center
        DRAW / scale, DRAW / scale,                               // src size
        tx + gap, ty + gap,                                       // dest: with gap offset
        DRAW, DRAW                                                // dest size
      )
    }
  }

  // ── Step 2: destination-in with letter shapes ───────────────────
  // Tiles only remain where the letter shapes are painted
  octx.globalCompositeOperation = 'destination-in'
  setFont(octx)
  octx.fillStyle = 'rgba(255,255,255,1)'
  octx.fillText('SHOGUN PIZZA', W / 2, H * 0.5)
  octx.globalCompositeOperation = 'source-over'

  // ── Step 3: Stamp onto main canvas (above CSS title) ──────────
  ctx.clearRect(0, 0, W, H)
  ctx.drawImage(offscreen, 0, 0)
}

// ─── Title opacity: dims slightly at peak ─────────────────────────
function updateTitle(p) {
  const opacity = 1
    - remap(p, 0.25, 0.48, 0, 0.45)
    + remap(p, 0.55, 0.78, 0, 0.45)
  cssTitle.style.opacity = Math.max(0.45, Math.min(1, opacity))
}

// ─── Scroll state ────────────────────────────────────────────────
let targetP  = 0
let currentP = 0

function updateTarget() {
  const rect   = section.getBoundingClientRect()
  const travel = section.offsetHeight - window.innerHeight
  targetP = Math.max(0, Math.min(1, -rect.top / travel))
}
window.addEventListener('scroll', updateTarget, { passive: true })

// ─── RAF loop ────────────────────────────────────────────────────
function tick() {
  updateTarget()
  currentP += (targetP - currentP) * 0.08
  const p = currentP

  drawMosaicInLetters(p)
  updateTitle(p)

  hud.textContent = `p: ${p.toFixed(3)}  cell: ${CELL}px  draw: ${DRAW}px`
  requestAnimationFrame(tick)
}

// Wait for font + image before starting
document.fonts.ready.then(() => {
  requestAnimationFrame(tick)
})
</script>

</body>
</html>
